name: source-verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false
      - run: go vet ./...
        working-directory: core
      - run: go test -race ./...
        working-directory: core
      - run: go build ./...
        working-directory: core
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm typecheck
        working-directory: desktop
      - run: pnpm test
        working-directory: desktop
      - run: pnpm build
        working-directory: desktop
      - run: python3 -B scripts/check-product.py
      - run: python3 -B scripts/test-product-check.py
      - run: python3 -B scripts/test-task-plans.py
      - run: node --test scripts/test-source-contracts.cjs
