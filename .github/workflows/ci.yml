name: source-verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false
      - run: go vet ./...
        working-directory: core
      - run: go test -race ./...
        working-directory: core
      - run: go build ./...
        working-directory: core
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm typecheck
        working-directory: desktop
      - run: pnpm test
        working-directory: desktop
      - run: pnpm build
        working-directory: desktop
      - run: python3 -B scripts/check-product.py
      - run: python3 -B scripts/test-product-check.py
      - run: python3 -B scripts/test-task-plans.py
      - run: node --test scripts/test-source-contracts.cjs
  web:
    runs-on: ubuntu-latest
    env:
      SVOLO_TEST_ELECTRON: ${{ github.workspace }}/desktop/node_modules/electron/dist/electron
    steps:
      - uses: actions/checkout@v4
      - name: Install native document readers and enable sandbox namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-ita xvfb
          # The disposable runner needs unprivileged namespaces for Bubblewrap and Chromium.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - name: Install the project's pinned native browser for web tests
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node node_modules/electron/install.js
          test -x "$SVOLO_TEST_ELECTRON"
      - run: pnpm test
        working-directory: web
